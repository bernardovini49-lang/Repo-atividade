<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Cadastre-se na ONG Mãos Unidas como voluntário ou apoiador.">
    <link rel="stylesheet" href="assets/styles/style.css">
    <link rel="icon" href="/assets/images/favicon.ico" type="image/png">
    <title>ONG Mãos Unidas - Cadastro</title>
</head>
<body>
    <header>
        <div class="container">
            <nav aria-label="Menu principal">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="projetos.html">Projetos</a></li>
                    <li><a href="cadastro.html">Cadastro</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="formulario-cadastro">
            <div class="container">
                <h1>Junte-se a Nós!</h1>
                <p>Preencha seus dados abaixo. Os campos com asterisco (*) são obrigatórios.</p>

                <form class="card cadastro-card" action="#" method="POST" autocomplete="on">

                    <fieldset>
                        <legend>Dados Pessoais</legend>
                        <div class="form-group">
                            <label for="nome">Nome Completo *</label>
                            <input type="text" id="nome" name="nome" required minlength="3" placeholder="Digite seu nome completo">
                        </div>

                        <div class="form-group">
                            <label for="email">E-mail *</label>
                            <input type="email" id="email" name="email" required placeholder="exemplo@email.com">
                        </div>

                        <div class="form-group">
                            <label for="cpf">CPF *</label>
                            <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3-\d{2}}" placeholder="000.000.000-00" title="Digite exatamente no formato 000.000.000-00">
                        </div>

                        <div class="form-group">
                            <label for="dataNascimento">Data de Nascimento *</label>
                            <input type="date" id="dataNascimento" name="dataNascimento" required>
                        </div>

                        <div class="form-group">
                            <label for="telefone">Telefone *</label>
                            <input type="tel" id="telefone" name="telefone" required pattern="(\d{2}\)\s\d{4,5}-\d{4}" placeholder="(00) 00000-0000" title="Digite no formato (00) 00000-0000">
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Endereço</legend>
                        <div class="form-group">
                            <label for="cep">CEP *</label>
                            <input type="text" name="cep" id="cep" required pattern="\d{5}-\d{3}" placeholder="00000-000" title="Digite no formato 00000-000">
                        </div>

                        <div class="form-group">
                            <label for="endereco">Endereço Completo *</label>
                            <input type="text" id="endereco" name="endereco" required placeholder="Rua, Avenida, Número, Bairro">
                        </div>

                        <div class="form-group">
                            <label for="estado">Estado *</label>
                            <select id="estado" name="estado" required>
                                <option value="">Selecione um estado</option>
                                <option value="SP">São Paulo</option>
                                <option value="RJ">Rio de Janeiro</option>
                                <option value="MG">Minas Gerais</option>
                                <option value="BA">Bahia</option>
                                <option value="PE">Pernambuco</option>
                            </select>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Perfil de Engajamento</legend>
                        <div class="form-group">
                            <label>Como você deseja participar?</label>
                            <div class="radio-group">
                                <input type="radio" id="perfilVoluntario" name="perfil" value="voluntario" required>
                                <label for="perfilVoluntario">Quero ser Voluntário</label>

                                <input type="radio" id="perfilDoador" name="perfil" value="doador">
                                <label for="perfilDoador">Quero ser Doador</label>
                            </div>
                        </div>
                    </fieldset>

                    <button type="submit" class="btn-submit">Enviar Cadastro</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2026 ONG Mãos Unidas. Todos os direitos reservados.</p>
                <nav aria-label="Navegação do rodapé">
                    <a href="index.html">Início</a>
                    <a href="projetos.html">Projetos</a>
                    <a href="cadastro.html">Cadastro</a>
                </nav>
            </div>
        </div>
    </footer>
</body>
</html>
